# Render Blueprint: New > Blueprint > select this repository.
# Free plan (512 MB RAM): low-memory mode, one page rendered at a time.
services:
  - type: web
    name: replicator-tools
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Google sign-in (mandatory) ---
      - key: GOOGLE_CLIENT_ID
        sync: false          # set in the Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false          # e.g. https://replicator-tools.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEV_AUTH
        value: "false"
      - key: LOW_MEMORY
        value: "true"
      - key: PAGE_CONCURRENCY
        value: "1"
      - key: ASSET_CONCURRENCY
        value: "4"
      - key: MAX_PAGES
        value: "8"
      - key: PROJECTS_DIR
        value: /data/projects
