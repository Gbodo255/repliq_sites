# Render Blueprint: New > Blueprint > select this repository.
# Free plan (512 MB RAM): low-memory mode, one page rendered at a time.
services:
  - type: web
    name: replicator-tools
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false          # asked when the Blueprint is created
      - key: LOW_MEMORY
        value: "true"
      - key: PAGE_CONCURRENCY
        value: "1"
      - key: ASSET_CONCURRENCY
        value: "4"
      - key: MAX_PAGES
        value: "8"
      - key: PROJECTS_DIR
        value: /data/projects
